<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight</p>
    </header>
    <main data-testid="board" aria-busy="true">
      <div data-testid="loader" class="loader" role="status"><span class="spinner" aria-hidden="true"></span>Loading incidents…</div>
      <p class="status" role="alert" hidden></p>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <div class="layout">
        <ul data-testid="incident-list" class="list" aria-live="polite"></ul>
        <aside class="side" aria-label="Incident">
          <p class="side-hint">Pick an incident to see it and ack it.</p>
          <section data-testid="incident-panel" id="incident-panel" class="panel" aria-live="polite" hidden>
            <header class="panel-head">
              <h2 class="panel-id"></h2>
              <button type="button" class="panel-close" aria-label="Close">×</button>
            </header>
            <p class="panel-what"></p>
            <p><time class="panel-time"></time></p>
            <button type="button" data-testid="panel-ack" class="ack panel-ack">Ack</button>
            <p class="panel-state acked" hidden></p>
          </section>
        </aside>
      </div>
    </main>
    <footer>sched-prod incident board · build <code data-testid="build-sha">__BUILD_SHA__</code></footer>
  </body>
</html>
